<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Aimbot - Free Fire</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Background Animation */
        .bg-animation {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,0,60,0.15) 0%, rgba(11,11,15,1) 70%);
            animation: pulseBg 6s infinite alternate;
            z-index: 0;
        }
        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Login Screen */
        #loginScreen {
            position: relative;
            z-index: 10;
            background: rgba(22, 22, 30, 0.95);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #ff0050;
            box-shadow: 0 0 25px rgba(255, 0, 80, 0.5);
            width: 320px;
            text-align: center;
        }
        #loginScreen h2 {
            color: #ff0050;
            margin-bottom: 20px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #loginScreen input {
            width: 100%;
            padding: 12px;
            background: #101015;
            border: 1px solid #ff0050;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        #loginScreen button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff0050, #b30036);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255,0,80,0.4);
        }
        #loginScreen button:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255,0,80,0.8);
        }

        /* Main Container */
        #mainContainer {
            display: none;
            position: relative;
            z-index: 10;
            width: 440px;
            background: rgba(20, 20, 28, 0.95);
            border-radius: 18px;
            border: 2px solid #ff0050;
            box-shadow: 0 0 35px rgba(255, 0, 80, 0.6);
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0050;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255,0,80,0.3);
        }

        .content-body {
            display: flex;
            height: 380px;
        }

        /* Sidebar Tabs */
        .sidebar {
            width: 110px;
            background: rgba(15, 15, 22, 0.9);
            border-right: 1px solid rgba(255,0,80,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 10px;
        }

        .tab {
            background: rgba(35, 35, 48, 0.6);
            border: none;
            border-radius: 12px;
            color: #aaa;
            padding: 12px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #ff0050, #b30036);
            color: #fff;
            box-shadow: 0 0 12px rgba(255,0,80,0.5);
        }

        .tab svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .tab span {
            font-size: 12px;
            font-weight: 600;
        }

        /* Tab Contents */
        .tab-content {
            flex: 1;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        /* Checkbox Grid */
        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-card {
            background: rgba(28, 28, 38, 0.8);
            border: 1px solid rgba(255,0,80,0.3);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
            transition: 0.2s;
        }

        .checkbox-card.checked {
            border-color: #ff0050;
            background: rgba(255, 0, 80, 0.1);
        }

        .checkbox-box {
            width: 16px;
            height: 16px;
            border: 2px solid #ff0050;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-card.checked .checkbox-box::after {
            content: '✔';
            font-size: 11px;
            color: #ff0050;
            font-weight: bold;
        }

        /* Slider */
        .slider-container {
            background: rgba(28, 28, 38, 0.8);
            border: 1px solid rgba(255,0,80,0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .slider-value {
            color: #ff0050;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            background: #101015;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff0050;
            cursor: pointer;
            box-shadow: 0 0 8px #ff0050;
        }

        /* Select */
        .select {
            width: 100%;
            padding: 10px;
            background: rgba(28, 28, 38, 0.8);
            border: 1px solid rgba(255,0,80,0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .select option {
            background: #161622;
            color: #fff;
        }

        /* Activate Button */
        .activate-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff0050, #b30036);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,80,0.4);
            transition: 0.3s;
            margin-top: 5px;
        }
        .activate-btn:hover {
            box-shadow: 0 0 20px rgba(255,0,80,0.8);
        }

        /* Info Tab Styles */
        .info-item {
            background: rgba(28, 28, 38, 0.8);
            border: 1px solid rgba(255,0,80,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .info-title {
            color: #ff0050;
            font-weight: bold;
        }
        .tip {
            font-size: 12px;
            color: #ccc;
            text-align: center;
            background: rgba(255,0,80,0.1);
            border-left: 3px solid #ff0050;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <!-- Login Screen -->
    <div id="loginScreen">
        <h2>Silent Aimbot</h2>
        <input type="password" id="keyInput" placeholder="Digite a Key de Acesso">
        <button id="loginBtn">ACESSAR</button>
    </div>

    <!-- Main Mod Menu -->
    <div id="mainContainer">
        <div class="header">Silent Aimbot</div>
        <div class="content-body">
            <!-- Sidebar -->
            <div class="sidebar">
                <button class="tab active" data-tab="aimbot">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#ff0050" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" fill="#ff0050"/><line x1="12" y1="2" x2="12" y2="7" stroke="#ff0050" stroke-width="2"/><line x1="12" y1="17" x2="12" y2="22" stroke="#ff0050" stroke-width="2"/><line x1="2" y1="12" x2="7" y2="12" stroke="#ff0050" stroke-width="2"/><line x1="17" y1="12" x2="22" y2="12" stroke="#ff0050" stroke-width="2"/></svg>
                    <span>aimbot</span>
                </button>
                <button class="tab" data-tab="info">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#ff0050" stroke-width="2" fill="none"/><line x1="12" y1="11" x2="12" y2="17" stroke="#ff0050" stroke-width="2"/><circle cx="12" cy="7" r="1.5" fill="#ff0050"/></svg>
                    <span>info</span>
                </button>
            </div>

            <!-- Aimbot Tab -->
            <div class="tab-content active" id="aimbot">
                <div class="grid-options">
                    <div class="checkbox-card checked" data-cb="aimbot">
                        <div class="checkbox-box"></div>
                        <span>Ativar Aimbot</span>
                    </div>
                    <div class="checkbox-card checked" data-cb="recoil">
                        <div class="checkbox-box"></div>
                        <span>NoRecoil</span>
                    </div>
                    <div class="checkbox-card checked" data-cb="precision">
                        <div class="checkbox-box"></div>
                        <span>aumentar precisão</span>
                    </div>
                    <div class="checkbox-card checked" data-cb="ignore">
                        <div class="checkbox-box"></div>
                        <span>Ignorar derrubados</span>
                    </div>
                </div>

                <div class="slider-container">
                    <div class="slider-value" id="fovValue">fov: [ 90.7 ]</div>
                    <input type="range" min="0" max="360" value="90.7" class="slider" id="fovSlider">
                </div>

                <select class="select" id="aimPosition">
                    <option>Cabeça</option>
                    <option selected>Pescoço</option>
                    <option>padrão</option>
                </select>

                <button class="activate-btn" id="activateBtn">INJETAR</button>
            </div>

            <!-- Info Tab -->
            <div class="tab-content" id="info">
                <div class="info-item">
                    <div class="info-title">Criado por:</div>
                    <div>devX</div>
                </div>
                <div class="info-item">
                    <div class="info-title">Créditos a:</div>
                    <div>silentffz</div>
                </div>
                <div class="info-item">
                    <div class="info-title">Modelo do telefone:</div>
                    <div class="phone-model" id="phoneModel">Detectando...</div>
                </div>
                <div class="tip">Dica: Ative no lobby e entre no treinamento para um melhor resultado</div>
            </div>
        </div>
    </div>

    <!-- Audio Ambience -->
    <audio id="rainSound" loop>
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-rain-ambience-1193.mp3" type="audio/mpeg">
    </audio>

    <script>
        const loginScreen = document.getElementById('loginScreen');
        const mainContainer = document.getElementById('mainContainer');
        const keyInput = document.getElementById('keyInput');
        const loginBtn = document.getElementById('loginBtn');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const checkboxes = document.querySelectorAll('.checkbox-card');
        const fovSlider = document.getElementById('fovSlider');
        const fovValue = document.getElementById('fovValue');
        const activateBtn = document.getElementById('activateBtn');
        const phoneModel = document.getElementById('phoneModel');
        const rainSound = document.getElementById('rainSound');

        // Login Logic (Key is 7)
        loginBtn.addEventListener('click', () => {
            if (keyInput.value.trim() === '7') {
                loginScreen.style.display = 'none';
                mainContainer.style.display = 'block';
                localStorage.setItem("loggedIn", "true");
                try { rainSound.play(); } catch(e){}
            } else {
                alert('Key incorreta! Tente novamente.');
                keyInput.value = '';
            }
        });

        keyInput.addEventListener('keypress', e => {
            if (e.key === "Enter") loginBtn.click();
        });

        // Tabs
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(tc => tc.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                localStorage.setItem("activeTab", tab.dataset.tab);
            });
        });

        // Checkboxes toggle
        checkboxes.forEach(cb => cb.addEventListener('click', () => cb.classList.toggle('checked')));
        
        // FOV Slider value update
        fovSlider.addEventListener('input', () => {
            fovValue.textContent = `fov: [ ${fovSlider.value} ]`;
        });

        // INJETAR button logic (Opens Free Fire and injects adjustments)
        activateBtn.addEventListener('click', () => {
            const selectedBone = document.getElementById('aimPosition').value;
            const currentFov = fovSlider.value;
            
            // Injeção de ajustes e abertura do Free Fire (versão 1.132.1)
            window.location.href = 'freefiremax://';
            setTimeout(() => {
                window.location.href = 'freefire://';
            }, 300);
        });

        // Detect phone model
        function detectPhoneModel() {
            const ua = navigator.userAgent;
            if (/iPhone/.test(ua)) {
                const m = /iPhone (\d+)/.exec(ua);
                return m ? `iPhone ${m[1]}` : "iPhone";
            } else if (/iPad/.test(ua)) {
                return "iPad";
            } else if (/Android/.test(ua)) {
                return "Android";
            } else {
                return "Navegador Móvel";
            }
        }

        // Restore state if logged in
        window.addEventListener('pageshow', () => {
            if (localStorage.getItem("loggedIn") === "true") {
                loginScreen.style.display = "none";
                mainContainer.style.display = "block";
            }
            const savedTab = localStorage.getItem("activeTab");
            if (savedTab) {
                tabs.forEach(t => t.classList.remove("active"));
                tabContents.forEach(tc => tc.classList.remove("active"));
                document.querySelector(`.tab[data-tab="${savedTab}"]`).classList.add("active");
                document.getElementById(savedTab).classList.add("active");
            }
        });

        window.addEventListener('load', () => {
            phoneModel.textContent = detectPhoneModel();
        });
    </script>
</body>
</html>
